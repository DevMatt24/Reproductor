name: Deploy a GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publicar
        run: dotnet publish -c Release -o release

      - name: Ajustar base href
        run: sed -i 's|<base href="/" />|<base href="/Reproductor/" />|' release/wwwroot/index.html

      - name: Evitar que Jekyll ignore carpetas con guion bajo
        run: touch release/wwwroot/.nojekyll

      - name: Copiar index.html como 404.html (para rutas de Blazor)
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - id: deployment
        uses: actions/deploy-pages@v4